project:
  output-dir: blog
  type: website
  title: "Macrohard"
  # post-render:
  #   - python sidebar.py
author: admin
website:
  page-navigation: true
  bread-crumbs: false
  navbar:
    background: primary
    left:
      - text: 博客首页
        href: /
      - text: 关于
        href: /about.html
  search:
    location: navbar
    type: overlay
  site-url: "https://www.macrohard.fun/"
  sidebar:
    - style: docked
      contents:
        - text: placeholder
          href: /
format:
  html:
    css:
      - styles/figure.css
    theme:
      dark: darkly
      light: cosmo
    toc: true
    html-math-method:
      method: mathjax
      url: https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/mathjax/3.2.0/es5/tex-chtml-full.js
include-in-header:
  text: |
    <link rel="shortcut icon" href="https://macrohard.fun/assets/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="https://macrohard.fun/assets/favicon.ico" />
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery-compat/3.0.0-alpha1/jquery.min.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/viewerjs/1.11.7/viewer.min.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/viewerjs/1.11.7/viewer.min.js"></script>
    <script src="/scripts/PopUpImage.js"></script>

include-after-body:
  - file: footer.html
  - text: |
      <script src="/scripts/mathjax-config.js"></script>
      <script src="/scripts/sidebar.js"></script>
lang: zh
filters:
  - Meta.lua
execute:
  cache: true